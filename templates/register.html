<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Expense Tracker</title>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(180deg, #edf4ff 0%, #f7f9fc 100%);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .auth-box {
        width: min(420px, 90vw);
        background: rgba(255,255,255,0.9);
        border: 1px solid #e5edf9;
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(20, 37, 63, 0.12);
        padding: 28px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 2rem;
      }
      form {
        display: grid;
        gap: 14px;
      }
      input, button {
        width: 100%;
        padding: 13px 14px;
        border-radius: 12px;
        border: 1px solid #dfeaf6;
        font-size: 15px;
      }
      button {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      .muted {
        margin-top: 16px;
        color: #59708b;
        text-align: center;
      }
      .muted a {
        color: #2d6cdf;
        text-decoration: none;
        font-weight: 700;
      }
      .error {
        color: #b91c1c;
        background: #fff1f2;
        border: 1px solid #fecdd3;
        padding: 10px 12px;
        border-radius: 10px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="auth-box">
      <h1>Create account</h1>
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <form method="post">
        <input type="text" name="username" placeholder="Username" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Register</button>
      </form>
      <div class="muted">
        Already have an account? <a href="/login">Login</a>
      </div>
    </div>
  </body>
</html>
